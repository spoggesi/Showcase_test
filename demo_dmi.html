<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>6. Demografici</title>
    <link href="jspsych/jspsych.css" rel="stylesheet" />
    <link href="jspsych/custom.css" rel="stylesheet" />

    <script src="jatos.js"></script>
    <script src="jspsych/jspsych.js"></script>
    <script src="jspsych/plugins/plugin-html-button-response.js"></script>

    <script src="js/dmi.js"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
</head>
<body>
    <div class="jspsych-content-wrapper">
        <div id="jspsych-content" class="jspsych-content"></div>
    </div>

    <script>
        jatos.onLoad(() => {
            // FIX: Variabile Globale
            window.jsPsych = initJsPsych({
                on_finish: () => {
                    var resultJson = jsPsych.data.get().json();
                    // Salva e passa all'ultimo (Conclusione)
                    jatos.submitResultData(resultJson, jatos.startNextComponent);
                }
            });

            const timeline = [];
            
            // 1. Intro DMI
            if (typeof generateDmiIntro === 'function') {
                timeline.push(generateDmiIntro());
            }

            // 2. Form DMI
            if (typeof dmiTimelineBlock !== 'undefined') {
                // Nota: dmiTimelineBlock è un oggetto { timeline: [...] }
                timeline.push(...dmiTimelineBlock.timeline);
            }

            jsPsych.run(timeline);
        });
    </script>
</body>
</html>
