<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Demo Cliente - Giotto Wine Listener</title>
    
    <link href="jspsych/jspsych.css" rel="stylesheet" />
    <link href="jspsych/custom.css" rel="stylesheet" />

    <style>
        /* --- STILI MOBILE --- */
        #orientation-warning {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #2c3e50; z-index: 9999; color: white; text-align: center;
            flex-direction: column; justify-content: center; align-items: center; padding: 20px;
        }
        @media only screen and (orientation: portrait) and (max-width: 900px) {
            #orientation-warning { display: flex; }
            .jspsych-content-wrapper { display: none; }
        }
        .mobile-iat-btn {
            position: fixed; bottom: 20px; width: 140px; height: 100px;
            font-size: 1.3rem; font-weight: bold; border: none; border-radius: 15px;
            color: white; box-shadow: 0 4px 10px rgba(0,0,0,0.3); display: flex; 
            justify-content: center; align-items: center; line-height: 1.2; padding: 10px; z-index: 1000; 
        }
        .btn-left { left: 20px; background-color: #27ae60; }
        .btn-right { right: 20px; background-color: #c0392b; }
        @media (min-width: 900px) { .mobile-iat-btn { display: none; } }
    </style>

    <script src="jatos.js"></script>
    <script src="jspsych/jspsych.js"></script>
    
    <script src="jspsych/plugins/plugin-html-button-response.js"></script>
    <script src="jspsych/plugins/plugin-html-keyboard-response.js"></script>
    <script src="jspsych/plugins/plugin-survey-likert.js"></script>
    <script src="jspsych/plugins/plugin-html-slider-response.js"></script>
    <script src="jspsych/plugins/plugin-survey-html-form.js"></script>
    <script src="jspsych/plugins/plugin-call-function.js"></script>
    <script src="jspsych/plugins/signature_pad.umd.min.js"></script>

    <script src="js/config.js"></script> 
    
    <script src="js/demo_intro.js"></script>      
    <script src="js/training_iat.js"></script>    
    <script src="js/task_iat.js"></script>        
    
    <script src="js/sensory.js"></script>         
    
    <script src="js/mock_interview.js"></script>  
    <script src="js/real_interview.js"></script> 
    <script src="js/interview_chooser.js"></script> <script src="js/survey.js"></script>          
    <script src="js/dmi.js"></script>
    <script src="js/final_page.js"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    </head>

<body>
    <div id="orientation-warning">
        <div style="font-size: 4rem;">🔄</div>
        <h1>Ruota il telefono</h1>
        <p>Per eseguire questo test, ruota il dispositivo in orizzontale.</p>
    </div>

    <div class="jspsych-content-wrapper">
        <div id="jspsych-content" class="jspsych-content"></div>
    </div>

    <script>
        // Rilevamento Mobile
        window.isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 900;
        
        const DEMO_CODE = "DEMO_01"; 
        const DEMO_ATTRIBUTES = {
            visual: ["Limpidezza", "Intensità Colore"],
            olfactory: ["Intensità", "Fruttato", "Floreale"],
            gustatory: ["Acidità", "Corpo", "Equilibrio"],
            retroOlfactory: ["Persistenza (PAI)", "Retrogusto Fruttato"]
        };

        jatos.onLoad(() => {
            // Inizializzazione Globale
            window.jsPsych = initJsPsych({
                on_finish: () => {
                    var resultJson = jsPsych.data.get().json();
                    if(typeof jatos !== 'undefined') {
                        jatos.submitResultData(resultJson); 
                    }
                }
            });

            if(typeof addParticipantDataToJsPsych === 'function') {
                addParticipantDataToJsPsych(jsPsych);
            }

            const timeline = [];

            // =======================================================
            // 1. INTRO VETRINA
            // =======================================================
            if (typeof consentTrial !== 'undefined') {
                console.log("Adding: Consent Trial");
                timeline.push(consentTrial);
            } else { console.error("MISSING: demo_intro.js"); }

            // =======================================================
            // 2. IAT TRAINING & TASK
            // =======================================================
            if (typeof generateIATTraining === 'function') {
                console.log("Adding: IAT Training");
                timeline.push(...generateIATTraining()); 
            }
            if (typeof generateEmotionTask === 'function') {
                console.log("Adding: Emotion Task");
                timeline.push(...generateEmotionTask(DEMO_CODE));
            }

            // =======================================================
            // 3. SENSORIALE RATA (La parte che ti spariva)
            // =======================================================
            if (typeof generateSensoryIntro === 'function') {
                console.log("Adding: Sensory Intro");
                timeline.push(generateSensoryIntro());
            } else { console.error("MISSING: generateSensoryIntro in sensory.js"); }

            if (typeof generateSensoryTrials === 'function') {
                console.log("Adding: Sensory Trials");
                // Attenzione: lo spread operator (...) qui è fondamentale
                const sensoryTrials = generateSensoryTrials(0, DEMO_CODE, DEMO_ATTRIBUTES);
                if(Array.isArray(sensoryTrials)) {
                    timeline.push(...sensoryTrials);
                } else {
                    console.error("ERRORE: generateSensoryTrials non ha restituito un array!");
                }
            } else { console.error("MISSING: sensory.js non caricato o funzione assente"); }

            // =======================================================
            // 4. VIDEO INTERVISTA (SCELTA)
            // =======================================================
            // Intro
            if (typeof generateInterviewIntro === 'function') {
                timeline.push(generateInterviewIntro());
            }

            // Selettore (Chooser)
            if (typeof generateInterviewSelection === 'function') {
                console.log("Adding: Interview Selection (Chooser)");
                timeline.push(...generateInterviewSelection(DEMO_CODE));
            } else {
                // Fallback se il file interview_chooser.js non c'è
                console.warn("ATTENZIONE: interview_chooser.js non trovato. Uso Mock di default.");
                if (typeof createMockVideoTrial === 'function') {
                    timeline.push(createMockVideoTrial(DEMO_CODE));
                }
            }

            // =======================================================
            // 5. SURVEY
            // =======================================================
            if (typeof generateSurveyIntro === 'function') timeline.push(generateSurveyIntro());
            if (typeof surveyTimelineBlock !== 'undefined') timeline.push(surveyTimelineBlock);

            // =======================================================
            // 6. DEMOGRAFICI
            // =======================================================
            if (typeof generateDmiIntro === 'function') timeline.push(generateDmiIntro());
            if (typeof dmiTimelineBlock !== 'undefined') timeline.push(...dmiTimelineBlock.timeline);

            // =======================================================
            // 7. PAGINA FINALE
            // =======================================================
            if (typeof generateFinalPage === 'function') {
                timeline.push(generateFinalPage());
            } else {
                timeline.push({
                    type: jsPsychHtmlButtonResponse,
                    stimulus: "<h1>Demo Terminata</h1>",
                    choices: []
                });
            }

            // Avvio
            console.log("Avvio Timeline con " + timeline.length + " blocchi.");
            jsPsych.run(timeline);
        });
    </script>
</body>
</html>
